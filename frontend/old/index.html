<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Live Device Map – OpenStreetMap</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />

  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; width: 100%; }
    .info-panel {
      position: absolute; top: 10px; left: 10px; z-index: 1000;
      background: rgba(255,255,255,0.9); padding: 10px 14px;
      border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      font-family: Arial; font-size: 14px;
    }
    .label { font-weight: bold; }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="info-panel">
    <div><span class="label">Device:</span> <span id="deviceId">–</span></div>
    <div><span class="label">Temperature:</span> <span id="temperature">–</span> °C</div>
    <div><span class="label">Battery:</span> <span id="battery">–</span> V</div>
    <div><span class="label">Latitude:</span> <span id="lat">–</span></div>
    <div><span class="label">Longitude:</span> <span id="lng">–</span></div>
    <div><span class="label">Altitude:</span> <span id="alt">–</span> m</div>
    <div><span class="label">Received at:</span> <span id="receivedAt">–</span></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map').setView([49.5, 8.5], 14);

    // WORKING TILE PROVIDER
    L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let marker = null;
    let circle = null;

    function updateMap(data) {
      const lat = data.map_location.latitude;
      const lng = data.map_location.longitude;
      const alt = data.map_location.altitude;

      document.getElementById("deviceId").textContent = data.device_id;
      document.getElementById("temperature").textContent = data.temperature.toFixed(1);
      document.getElementById("lat").textContent = lat.toFixed(6);
      document.getElementById("lng").textContent = lng.toFixed(6);
      document.getElementById("alt").textContent = alt;
      document.getElementById("receivedAt").textContent = data.received_at;

      const pos = [lat, lng];
      map.setView(pos, 16);

      if (!marker) {
        marker = L.marker(pos).addTo(map);
      } else {
        marker.setLatLng(pos);
      }

      if (!circle) {
        circle = L.circle(pos, { radius: 20, color: "blue", fillOpacity: 0.2 }).addTo(map);
      } else {
        circle.setLatLng(pos);
      }
    }

    // CONNECT TO WEBSOCKET
    const ws = new WebSocket("ws://localhost:8080");

    ws.onopen = () => console.log("WebSocket connected");

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        updateMap(data);
      } catch (e) {
        console.error("Invalid JSON:", e);
      }
    };

    ws.onerror = (err) => console.error("WebSocket error:", err);
    ws.onclose = () => console.log("WebSocket closed");
  </script>
</body>
</html>
